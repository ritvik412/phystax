name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Offline test suite (no API keys; synthetic SAM stand-in where needed)
        env:
          PHYSTAX_INTERVAL_SAMPLES: "8"
        run: python -m pytest -q
